name: FRED 진단 (임시)
on:
  push:
    branches: [probe/fred]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: curl로 접근
        run: |
          curl -s -o /tmp/f.csv -w "curl: http=%{http_code} size=%{size_download} time=%{time_total}\n" --max-time 30 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=FEDFUNDS"
          head -c 120 /tmp/f.csv; echo
      - name: python으로 접근
        run: |
          pip install -q requests
          python probe_fred.py
