name: 한경 접근 진단 (probe)

on:
  push:
    branches:
      - probe/hankyung

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 의존성 설치
        run: pip install requests curl_cffi
      - name: 한경 피드 접근 진단
        run: python probe_hankyung.py
