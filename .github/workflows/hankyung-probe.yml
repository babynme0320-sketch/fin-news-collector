name: 한경 접근 진단 (probe)

on:
  push:
    branches:
      - probe/hankyung

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 의존성 설치
        run: pip install requests curl_cffi
      - name: 한경 접근 비교 (job ${{ matrix.n }})
        run: python probe_hankyung.py
