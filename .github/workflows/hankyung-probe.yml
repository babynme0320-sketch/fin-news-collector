name: 한경 접근 진단 (probe)

on:
  push:
    branches:
      - probe/hankyung

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 수정본 한경 수집 검증 (실제 WebScraperCollector)
        run: python validate_hankyung.py
