# WebScraperCollector가 이 파일에서 직접 읽어 동작
# 새 웹/PDF 소스 추가: 이 파일에 항목 추가, 코드 수정 불필요

web_sources:
  # 전체 기사용(기본 비활성). RSS(/feed/*)는 403이므로 HTML 페이지를 사용한다.
  - name: "한국경제"
    enabled: false
    url: "https://www.hankyung.com/"
    type: "articles"
    parser: "html.parser"
    selectors:
      list_container: ""
      item: "div.news-item"
      title: ".news-tit a"
      link: ".news-tit a"
      date: "p.txt-date, p.date"
      lede: "p.lead"
    max_items: 10
    encoding: "utf-8"

  # 한경 RSS(/feed/*)는 Cloudflare 인터랙티브 챌린지가 걸려 403 → 섹션 HTML 페이지를 사용.
  # 섹션 페이지는 주제가 이미 분리되어 있어 기사별 섹션 필터링(inspect_article_section)이 불필요하다.
  - name: "한국경제 금융·마켓"
    enabled: true
    url: "https://www.hankyung.com/industry"
    type: "articles"
    parser: "html.parser"
    selectors:
      list_container: ""
      item: "div.news-item"
      title: ".news-tit a"
      link: ".news-tit a"
      date: "p.txt-date, p.date"
      lede: "p.lead"
      lede_url: true
    max_items: 8
    encoding: "utf-8"

  - name: "한국경제 경제"
    enabled: true
    url: "https://www.hankyung.com/economy"
    type: "articles"
    parser: "html.parser"
    selectors:
      list_container: ""
      item: "div.news-item"
      title: ".news-tit a"
      link: ".news-tit a"
      date: "p.txt-date, p.date"
      lede: "p.lead"
      lede_url: true
    max_items: 8
    encoding: "utf-8"

  - name: "CNBC 경제"
    enabled: true
    url: "https://www.cnbc.com/id/20910258/device/rss/rss.html"
    type: "articles"
    parser: "lxml-xml"
    selectors:
      list_container: ""
      item: "item"
      title: "title"
      link: "link"
      date: "pubDate"
      lede: "description"
    max_items: 10
    encoding: "utf-8"

  - name: "NYT 경제"
    enabled: true
    url: "https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml"
    type: "articles"
    parser: "lxml-xml"
    selectors:
      list_container: ""
      item: "item"
      title: "title"
      link: "guid"
      date: "pubDate"
      lede: "description"
    max_items: 10
    encoding: "utf-8"

  - name: "매일경제"
    enabled: true
    url: "https://www.mk.co.kr/news/economy/"
    type: "articles"
    parser: "html.parser"
    selectors:
      list_container: "ul.article_list_bx"
      item: "li.article_list"
      title: "h4"
      link: "a.news_item"
      lede: "p.art_desc"
      date: "p.time_info"
    max_items: 10
    encoding: "utf-8"

  - name: "한국경제 사설"
    enabled: true
    url: "https://www.hankyung.com/opinion"
    type: "articles"
    parser: "html.parser"
    selectors:
      list_container: ""
      item: "div.news-item"
      title: ".news-tit a"
      link: ".news-tit a"
      date: "p.txt-date, p.date"
      lede: "p.lead"
    max_items: 9
    encoding: "utf-8"

  - name: "매일경제 사설"
    enabled: true
    url: "https://www.mk.co.kr/opinion/editorial/"
    type: "articles"
    parser: "html.parser"
    selectors:
      list_container: "ul.article_list_bx"
      item: "li.article_list"
      title: "h4"
      link: "a.news_item"
      lede: "p.art_desc"
      date: "p.time_info"
    max_items: 5
    encoding: "utf-8"

  # 미래에셋: href가 javascript:downConfirm('https://...') 형태라 link_pattern으로 URL을 뽑는다.
  # 페이지가 EUC-KR이라 encoding을 지정하지 않으면 제목이 깨진다.
  - name: "미래에셋 리서치"
    enabled: true
    url: "https://securities.miraeasset.com/bbs/board/message/list.do?categoryId=1521"
    type: "pdf_links"
    parser: "html.parser"
    encoding: "euc-kr"
    link_pattern: "downConfirm\\('([^']+)'"
    selectors:
      list_container: ""
      item: "table tr"
      title: "div.subject a"
      link: "a[href^='javascript:downConfirm']"
      date: "td:first-child"
    max_items: 10

  - name: "KB금융 리서치"
    enabled: true
    url: "https://www.kbsec.com/go.able?linkcd=s040203010001"
    type: "pdf_links"
    response_format: "json"
    request_method: "POST"
    request_data:
      tab: "1"
      searchMonth: "1"
      searchTxt: ""
      searchFlag: ""
      pCatfolderid: ""
      templateid: ""
      lowTempId: ""
    items_key: "list"
    fields:
      title: "docTitle"
      link: "urlLink"
      date: "publicDate"
    max_items: 10
    encoding: "utf-8"

# 관심 키워드: 제목에 이 말이 들어간 기사를 모아 상단에 "⭐ 관심" 섹션으로 보여준다.
# 비워두면 섹션이 생기지 않는다. 본인 관심사에 맞게 고쳐 쓸 것.
interest_keywords:
  - "반도체"
  - "환율"
  - "금리"
  - "부동산"
  - "원전"
  - "대미투자"

# 특수 수집 로직(API/SDK) → 전용 클래스 유지
# 알림: 하루 1회 브리핑 + 속보 즉시. enabled를 true로 바꾸고 자격증명을 넣어야 동작한다.
#   텔레그램 봇 토큰/chat id는 환경변수 TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 로 넣는 것을 권장
#   (CI에서는 GitHub Secrets). 없으면 조용히 아무것도 보내지 않는다.
notify:
  enabled: false
  report_url: "https://babynme0320-sketch.github.io/fin-news-collector/"
  daily_after_hour: 6      # KST 기준 이 시간 이후 첫 실행에서 하루 1회 발송
  max_movers: 6            # 브리핑에 넣을 지수 개수(변동 폭 큰 순)
  # bot_token: ""          # 또는 환경변수로
  # chat_id: ""            # 또는 환경변수로

# 오늘의 핵심 요약: 수집된 헤드라인을 LLM에 넘겨 5줄 요약 + 키워드를 받는다.
# 키는 DEEPSEEK_API_KEY 환경변수 또는 ~/.deepseek_key. 없으면 요약 없이 리포트만 생성된다.
summary:
  enabled: true
  model: "deepseek-flash"
  max_headlines: 60
  max_points: 5

# FOMC 회의자료: 회의 달력 페이지에서 성명서·의사록·경제전망 PDF 링크를 뽑는다.
fomc:
  enabled: true
  url: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"
  include:
    - "statement"    # 성명서 (회의 종료일 기준)
    - "minutes"      # 의사록 (공표일 기준, 회의 3주 뒤)
    - "projections"  # 경제전망 SEP (3·6·9·12월 회의, 회의 종료일 기준)
  max_items: 8

hana_brief:
  enabled: true
  channel_id: "UCP8KMauNQ5YhTL8fzoSYcfQ"
  max_videos: 10

housekeeping:
  retention_days: 10

market_data:
  enabled: true
  symbols:
    - { ticker: "^KS11", name: "KOSPI" }
    - { ticker: "^KQ11", name: "KOSDAQ" }
    - { ticker: "^DJI", name: "다우존스" }
    - { ticker: "^GSPC", name: "S&P 500" }
    - { ticker: "^IXIC", name: "NASDAQ" }
    # 주의: 국고채는 네이버 marketindex가 이전(stock.naver.com 개편)하면서 소스가 죽었다.
    # interestDailyQuote.naver가 410을 반환해 새 데이터가 들어오지 않고, 캐시된 마지막 값이
    # 카드에 "⚠️ N일 전" 표시와 함께 나온다. 살리려면 한국은행 ECOS API 키가 필요하다.
    - { ticker: "KR_BOND_3Y", name: "국고채 3년" }
    - { ticker: "^TNX", name: "미국채 10년" }
    - { ticker: "^TYX", name: "미국채 30년" }
    - { ticker: "DX-Y.NYB", name: "달러인덱스" }
    - { ticker: "CL=F", name: "WTI 원유" }
    - { ticker: "USDKRW=X", name: "달러/원" }
    - { ticker: "USDJPY=X", name: "달러/엔" }
    - { ticker: "EURUSD=X", name: "유로/달러" }
    - { ticker: "^VIX", name: "VIX" }
